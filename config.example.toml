# ---------------------------------------------------------------- generators
# Unit IDs match DSE Scada Suite. The controllers answer on any ID, so check
# each IP against Scada Suite's file: a swapped IP would show the wrong
# generator's values under this name.

[[generator]]
name = "GEN1"
ip = "<IP>"
unit = 11

[[generator]]
name = "GEN2"
ip = "<IP>"
unit = 12

[[generator]]
name = "GEN3"
ip = "<IP>"
unit = 13

# ---------------------------------------------------------------- PDUs read directly
# PDUs listed in pdus.toml (first exported from Power IQ, now kept by hand:
# name, id, IP, rack, model, family) and read directly over SNMP
# v2c, read only: Raritan PX2/PX3 (raritan_px2), Raritan PX1 (raritan_px1),
# Geist/Vertiv (geist) and APC AP8881 (apc). Power, every breaker or phase
# (a tripped breaker is a real alarm at once on the Raritan PDUs; Geist and
# APC have no trip state), temperature probes.
#
# A PDU whose read community differs from the others gets its own line in
# pdus.toml, under its [[pdu]]: community = "<ITS-READ-COMMUNITY>" (kept when
# the file is edited). A PDU that should raise no alarms (work on it, a
# test unit) is put in maintenance from its rack's popup on the floor map;
# that is stored in the database, not in a file.

[pdus]
file = "pdus.toml"     # the PDU list, next to config.toml
interval_s = 30        # seconds between rounds (all PDUs, 8 at a time)
timeout_s = 3          # seconds to wait for each PDU's answer
alarm_after_failures = 3   # "not answering" alarm after this many failed reads in a row (1 = at once)
community = "<READ-COMMUNITY>"   # read community of every PDU (absent: the [[pdu_sensor]] one)

# Rules for the PDU readings.
rack_temp_alarm_c = ""           # empty = rack alarm off; a number turns it on
breaker_alarm_pct = 90           # red alarm with sound at this % of a breaker's limit; empty = off
breaker_warning_pct = 80         # amber notice, one soft sound; empty = off; absent = 80
breaker_highlight_pct = 45       # colour on the floor map only, no sound; empty = off; absent = 45
default_breaker_limit_a = 16     # limit where the PDU gives no rating (Geist breakers)
# Circuit follower: each circuit and PDU inlet against its normal.
follow_drop_min_a = 0.1          # a circuit normally at or above this is watched: alarm when it
                                 # drops to zero (reads 0.0 A), notice when it gives no reading;
                                 # empty = both off
follow_readings = 2              # new readings in a row before anything is raised
follow_normal_days = 7           # a circuit's normal = its average over this many days (max 28)
follow_stale_after_s = 10800     # "no new reading" notice for a PDU after this long

# ---------------------------------------------------------------- PDU probes
# Single temperature probes on PDUs that are not in pdus.toml (on site:
# PDUs Power IQ does not know). An entry whose PDU is read
# directly ([pdus]) is skipped: that PDU's probes come with its readings.
#
# How dcmonitor uses them:
#   - Each probe is read every interval_s seconds over SNMP v2c (read only).
#   - A rack shows a PDU read directly (pdus.toml) first,
#     then this probe.
#   - Clicking a rack on the floor map shows which source its value came from.
#
# The [pdu_sensors] section below appears ONCE: settings shared by all probes.
# The [[pdu_sensor]] block appears once PER PROBE; copy it for each rack.
# To stop reading PDUs directly, remove every [[pdu_sensor]] block.

[pdu_sensors]
community = "<READ-COMMUNITY>"   # SNMP read community shared by these PDUs
interval_s = 300                 # seconds between readings
timeout_s = 3                    # seconds to wait for each PDU's answer

# One block per rack:
#   rack       rack number, as on the floor map and in Power IQ
#   ip         the PDU the probe is plugged into
#   community  optional: only if this PDU uses a different read community
#
# Which probe is read, if the PDU has more than one:
#   leave both lines out   automatic: the available probe, the warmer if several
#   serial = "..."         a fixed probe, by the Device ID on the PDU's web page
#   probe = 2              a fixed probe, by its SNMP position (not the web
#                          page's order, which can differ)

[[pdu_sensor]]
rack = 0
ip = "<IP>"

# ---------------------------------------------------------------------------
# Cabinet list: the Excel workbook (.xlsx) of devices per rack, one sheet per
# rack named by its number (U/Cabinet | devices | PDU columns). The rack
# popup's Devices button draws the rack as on its sheet, with each PDU
# outlet's current from the PDU. Read only: the file is copied into memory and
# closed at once, never written or locked. Optional: absent = no Devices button.
[cabinet_list]
# Single quotes keep the backslashes of a share path as written.
file = '\\<server>\<share>\<folder>\<name>.xlsx'
check_interval_s = 5             # how often the file's time and size are checked;
                                 # it is read again only when they change (1-3600)
