# dcmonitor configuration.
# Copy this file to config.toml in the same folder and fill in real values.
# config.toml is excluded from git and is copied to the VM by hand.

[display]
# Times are stored in UTC and shown in local time. Turkey is UTC+3 all year.
utc_offset_hours = 3

[storage]
database = "dcmonitor.db"       # relative to the program folder
log_folder = "logs"             # program log files, rotated daily
site_map = "site_map.toml"      # floor layout for the Floor map tab

[polling]
# Old units (AC-2..AC-6): Boa web server
old_ac_event_interval_s = 90    # HEAD on /tmp/statusreport.xml
old_ac_values_interval_s = 120  # index.html values
old_ac_timeout_s = 35           # these units stall for ~30s at random
old_ac_clock_utc_offset_hours = 3   # their event log uses local time (site local time)

# New units (AC-1, AC-7..AC-10): Vertiv iCOM
new_ac_values_interval_s = 15   # getvar.csv: temperature, setpoint, humidity
new_ac_events_interval_s = 30   # alarms.cgi event log
new_ac_timeout_s = 15
new_ac_max_query_chars = 480    # unit drops requests above ~510 characters
new_ac_clock_utc_offset_hours = 3   # event log says +00:00 but the clock is local

# UPS 1..5: SNMP v1
ups_interval_s = 10
ups_details_interval_s = 60     # UPS tab: names, versions, battery, bypass; absent = 60
ups_timeout_s = 2
ups_retries = 2

unreachable_after_failures = 5  # raise "device unreachable" after this many

# Generators: DSE8610 MKII over Modbus TCP, read-only
generator_interval_s = 30

[retention]
readings_days = 365
circuit_history_days = 30       # per-circuit amps for the circuit follower; absent = 30
alarms_days = 365
unit_events_days = 365
poll_log_days = 30

[thresholds]
ac_alarm_above_setpoint_c = 3   # alarm at setpoint + 3 C
ac_clear_above_setpoint_c = 3   # clear below setpoint + 3 C
ac_alarm_delay_s = 60           # must stay at the limit this long before alarming
new_ac_return_alarm_c = 35      # new units (AC-1, AC-7..AC-10): fixed return limit
ups_battery_temp_alarm_c = 30
generator_fuel_low_pct = ""     # empty = off; a number turns the low-fuel alarm on
generator_battery_low_v = ""    # empty = off; e.g. 12.0 for a 12 V battery system
ups_battery_charge_alarm_below_pct = 70   # on-battery is caught by output source, so this is a low-charge alarm
ups_input_voltage_alarm_below_v = 190     # any input phase below this raises an alarm; empty = off; absent = 190

[events]
# Event IDs from the new units that are routine and must not sound the alarm.
# Everything else is treated as an alarm. Add IDs here when a harmless event
# makes noise. Descriptions are in dcmonitor/event_descriptions.py.
informational_ids = [
  152,   # Ultracap Active
  153,   # Power On
  154,   # Power Off
  155,   # Unit On
  156,   # Unit Off
  206,   # Unit Off by Display
  212,   # Unit Standby Mode
]

[snmp]
community = "public"

# ---------------------------------------------------------------- AC units
# generation = "old": Boa web server, statusreport.xml + index.html
# generation = "new": Vertiv iCOM, getvar.csv and alarms.cgi on the unit's IP

